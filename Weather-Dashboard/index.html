<!DOCTYPE html>

<html>
    <head>

         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Weather-Dashboard</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Weather Dashboard</h1>
            <form id="search-form">
                <input type="text" id="city-input" placeholder="Search for a city !!">
                <button type="submit" id="search_btn">Search</button>
            </form>
        </header>
        <main>
            <section id="current-weather">
                <div>
                    <h2 id="city-name">City</h2>
                    <p id="date"></p>    
                </div>
                <div>
                    <img src="" alt="Weather-Condition" id="weather-icon">
                    <h3 id="temperature">--°C</h3>
                    <p id="condition">--</p>
                </div>
                <div class="weather-details">
                    <div>
                        <span>Feels Like</span>
                        <p id="feels-like">--°C</p>
                    </div>
                    <div>
                        <span>Humidity</span>
                        <p id="humidity">--%</p>
                    </div>
                    <div>
                        <span>Wind</span>
                        <p id="wind">-- km/h</p>
                    </div>
                    <div>
                        <span>Pressure</span>
                        <p id="pressure">-- hPa</p>
                    </div>
                </div>
            </section>
            <section id="hourly-forecast">
                <div>
                    <h2>Hourly Forecast</h2>
                </div>
                <div id="hourly-container">

                </div>
            </section>
            <section id="daily-forecast">
                <h2>5-Day Forecast</h2>
                <div id="daily-container">

                </div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
