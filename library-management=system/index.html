<!DOCTYPE html>
<html>
    <head>
        <title>Library Management System</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

      <div class="container">

        <h1>Library Management System</h1>
        
        <label for="bookTitle">Enter a book name:</label>
        <input type="text" id="bookTitle"> <br>

        <label for="author">Author:</label>
        <input type="text" id="author"> <br>

        <label for="searchBook">Book-ID:</label>
        <input type="number" id="searchBook"> <br>

        <div class="buttons">
            <button id="addBook">Add Book</button>
            <button id="borrowBook">Borrow Book</button>
            <button id="returnBook">Return Book</button>
            <button id="showBook">Show Books</button>
            <button id="reset">Reset</button>
        </div>

        <h3 id="output"></h3>
      
    </div>

    <script src="script.js"></script>
    
</body>

</html>
