<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ara's Game-Hub</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
       <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
        />
    </head>
    <body>
        <header>
            <h1 id="hub-title">Ara's Game-Hub</h1>
            <nav id="navbar">
                <a href="index.html">Home</a>
                <a href="discover.html">Discover</a>
                <a href="genres.html">Genres</a>
                <a href="favorites.html">Favorites</a>
            </nav>
            <form id="search-form">
                <input type="text" id="game-input" placeholder="Search a game">
                <button type="submit" id="search-btn">Search</button>
            </form>
        </header>
        <main>
            <section id="hero">
                <h2>Welcome to Ara's Game-Hub</h2>
                <p>Discover your next favorite game</p>
                <a href="discover.html" id="explore-btn">Explore Games</a>
                
            </section>
            <section id="trending">
                    <h2 id="trend">🔥 Trending Games</h2>

                    <!-- Slider main container -->
                    <div class="swiper trending-swiper">

                        <!-- Required wrapper -->
                        <div class="swiper-wrapper" id="trending-container">
                            <!-- JavaScript will add .swiper-slide here -->
                        </div>

                        <!-- Navigation -->
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>

                        <!-- Pagination -->
                        <div class="swiper-pagination"></div>

                    </div>
                </section>

            <section id="popular">
            <h2 id="popular-title">Popular Games</h2>

            <div class="swiper popular-swiper">

                <div class="swiper-wrapper" id="popular-container">
                    <!-- JS will add cards here -->
                </div>

                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>

                <div class="swiper-pagination"></div>

            </div>
        </section>
        <footer id="footer">
    <div class="footer-content">

        <h2>Ara's Game-Hub</h2>

        <p>Discover your next favorite game.</p>

        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="discover.html">Discover</a>
            <a href="genres.html">Genres</a>
            <a href="favorites.html">Favorites</a>
        </div>

    </div>

    <p class="copyright">
        © 2026 Ara's Game-Hub. Built for personal use.
    </p>
    </footer>
           

        </main>
        <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
