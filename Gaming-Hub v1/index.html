<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ara's Game-Hub</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1 id="hub-title">Ara's Game-Hub</h1>
            <nav id="navbar">
                <a href="index.html">Home</a>
                <a href="discover.html">Discover</a>
                <a href="genres.html">Genres</a>
                <a href="favorites.html">Favorites</a>
            </nav>
            <form id="search-form">
                <input type="text" id="game-input" placeholder="Search a game">
                <button type="submit" id="search-btn">Search</button>
            </form>
        </header>
        <main>
            <section id="hero">
                <h2>Welcome to Ara's Game-Hub</h2>
                <p>Discover your next favorite game</p>
                <a href="discover.html" id="explore-btn">Explore Games</a>
                
            </section>
            <section id="trending">
                <h2 id="trend">Trending Games</h2>
                <div id="trending-container">
                    <div class="game-card">
                        <img src="images/cp2077.jpg" alt="Cyberpunk">
                        <div class="game-info">
                            <h3>Cyberpunk 2077</h3>
                            <p>⭐ 4.5</p>
                            <p>Action * RPG</p>
                        </div>
                    </div>
                </div>
            </section>

             <section id="popular">
                <h2 id="trend">Popular Games</h2>
                <div id="popular-container">
                    <div class="game-card">
                        <img src="images/cp2077.jpg" alt="Cyberpunk">
                        <div class="game-info">
                            <h3>Cyberpunk 2077</h3>
                            <p>⭐ 4.5</p>
                            <p>Action * RPG</p>
                        </div>
                    </div>
                </div>
            </section>
           

        </main>
        <script src="script.js"></script>
    </body>
</html>
