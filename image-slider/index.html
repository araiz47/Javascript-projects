<!DOCTYPE html>

<html>
    <head>
        <title>Image-Slider</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="slider">
            <h1>IMAGE-SLIDER</h1>
            <div class="slides">
                <img class="slide" src="2b.jpeg" alt="image of wife">
                <img class="slide" src="Kara.jpg" alt="best girl">
                <img class="slide" src="shinobu.jpg" alt="another best girl">
            </div>
            <button class="prev" onclick="prevSlide()">&#10094</button>
            <button class="next" onclick="nextSlide()">&#10095</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
